version: '3.8'

services:
  app:
    image: ${DOCKER_IMAGE:-elidickinson/happy-server-light:latest}
    container_name: happy-server-light
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - PUBLIC_URL=${PUBLIC_URL:-https://your-domain.com}
    volumes:
      - ../files/data:/app/.happy
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
